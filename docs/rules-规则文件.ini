; RULE*.INI
; *** 红色警戒2 规则 ***
; 如果放置在游戏目录中，它将覆盖内置值。值将用作乘数
; 或者百分比可以指定为简单的浮点数（包含"."）或作为
; 常规百分比数字（附加“%”）。用作距离或时间延迟的值
; 被指定为简单浮点数。距离值以格子表示。时间
; 数值以分钟为单位表示。
; 如果存在多个规则文件，则使用名称字段来区分它们。

[General]
UIName=Name:General
Name=Red Alert 2 -- Official Rules of Engagement

; 老兵因素；自从护甲被破坏后，GS 已检查过这些。现在它们都是倍增器。
VeteranRatio=3.0       ; 必须摧毁这个自我价值的倍数以成为每级老兵
VeteranCombat=1.1       ; 伤害倍数
VeteranSpeed=1.2        ; 最大速度倍增器
VeteranSight=1.2        ; 视线倍增器！！！超过十是硬编码的维加斯崩溃！！！
VeteranArmor=1.5        ; 对于护甲，可以将其视为最大力量乘以该数字（实际上，伤害是被这个数字除的）
VeteranROF=0.6          ; 射速延迟乘数
VeteranCap=2            ; 可获得的最高老兵等级
InitialVeteran=no       ; 初始部队是否为老兵？

; 修理和改装
RefundPercent=50%       ; 出售建筑/单位时可返还的原始成本百分比
ReloadRate=.3           ; 每次为飞机或直升机重新装填弹药的分钟数
RepairPercent=15%       ; 完全修理的成本百分比与全额成本的比率
RepairRate=.016         ; 应用修复步骤之间的分钟数
RepairStep=8            ; 每次修复“滴答”恢复的生命值
URepairRate=.016        ; [仅限单位]应用修复步骤之间的分钟数
IRepairRate=.001        ; [仅限步兵]应用修复步骤之间的分钟数
IRepairStep=20           ; [仅限步兵]每次修复“滴答”恢复的步兵生命值
TiberiumHeal=.010       ; 应用泰伯利亚治疗之间的分钟数 [对于在泰伯利亚中恢复的单位]

; 收入和生产
;BailCount=28            ; 收割机携带的“弃料”数量
BuildSpeed=.7           ; 一般建造速度 [生产一个价值1000信用点物品所需时间（分钟）]
BuildupTime=.06         ; 建筑累计建造动画平均运行分钟数
GrowthRate=5            ; 矿石（泰伯利亚）生长之间的分钟数
TiberiumGrows=yes       ; 矿石会随着时间变得更密集吗？
TiberiumSpreads=yes     ; 矿石会扩散到邻近区域吗？
SeparateAircraft=yes    ; 第一架直升机是否需要单独购买，而不是随直升机停机坪？
SurvivorRate=.4         ; 出售建筑时转换为幸存者的建筑成本比例；gs 这已不再使用，因为建筑的出售价格提供了更多控制
AlliedSurvivorDivisor=500     ; gs 将建筑的出售成本除以此数以获得幸存者数量
SovietSurvivorDivisor=250 ; gs 由于不再有通用步兵，因此需要此拆分
PlacementDelay=.05      ; 如果检测到临时堵塞，重试放置生成对象的延迟
WeedCapacity=56         ; 建造化学导弹所需的房屋收割杂草数量
HarvestersPerRefinery=2 ; gs 这以前是硬编码的。如果它在这里，则设计师可以在地图中覆盖它（它控制在武器工厂决定下一步建造时覆盖队伍）

; 计算机和移动控制
CurleyShuffle=no       ; 直升机是否应在射击之间调整位置 [如《命令与征服》]？
BaseBias=2              ; 当敌人接近友军基地时，对威胁目标价值的乘数
BaseDefenseDelay=.25    ; 派遣响应小组处理基地威胁之间的分钟延迟
CloseEnough=2.25        ; 如果到目的地的距离小于此值，则在其他受阻情况下中止移动。
DamageDelay=1           ; 电量低时，每隔多少分钟对微小结构造成伤害
GameSpeedBias=1.6       ; 整体游戏对象移动速度的乘数
;以前是1.2
Stray=2.0               ; 队伍成员可能偏离而不会触发重新集结动作的半径距离（格数）
RelaxedStray=3.0 ;gs 收集命令将使用此数字，从而允许AIT中有更大的团队
CloakDelay=.02          ; 强制延迟，潜艇在允许潜入前将在水面停留的时间
SuspendDelay=2          ; 悬挂团队将在悬挂状态下保持的分钟数
SuspendPriority=1       ; 在基地防御行动中，优先级低于此值的团队将挂起
FlightLevel=900        ;gs 从600开始；飞机的典型飞行高度[离地高度]
ParachuteMaxFallRate=-3
NoParachuteMaxFallRate=-100
GuardModeStray=2.0		; BGC - 单位在被告知移动前，可以离其守护单位多远（格数）


MissileSpeedVar=.25     ; 制导导弹的速度波动百分比
MissileROTVar=.25       ; 制导导弹的转向速率波动百分比
MissileSafetyAltitude=750 ;gs 这是对空目标发射的导弹在炸开之前会飞到的高度

;DB 看这里！-RTO
TeamDelays=2000,2500,3500               ; 按难度等级（简单、中等、困难）检查和创建队伍之间的间隔
;TeamDelays=1200,1350,1600

AIHateDelays=30,50,70               ; 在电脑选择敌人之前按难度级别延迟的帧数
AIAlternateProductionCreditCutoff=1000 ; 什么时候开始害怕花钱

NodAIBuildsWalls=no
AIBuildsWalls=no

; -RTO*
MultiplayerAICM=400,0,0 ;多人游戏金钱人工智能系数（天才、聪明、简单）；分别为400、300、200
AIVirtualPurifiers=4,2,0 ; h,m,e gs 通常每个为 25%，这控制收获金钱的奖励，但在战役中除外（8,4,2）
HealScanRadius=10       ; 医护类单位应该扫描目标的距离有多远？以前用于覆盖范围
                        ; 这些单位，因为它们需要有非常短的射程
FillEarliestTeamProbability=100,100,100 ; （按难度等级，从最难到最容易）

;数据库已更改如下 -RTO
MinimumAIDefensiveTeams=1,1,1    ; （按难度等级，从最难到最容易）
MaximumAIDefensiveTeams=2,2,2	   ; "                                            "
TotalAITeamCap=30,30,30   ; （按难度等级，从最难到最容易）
UseMinDefenseRule=yes
DissolveUnfilledTeamDelay=5000	; 在解散没有成员的 AI 触发团队（仅限多人游戏）之前需要等待多久

LargeVisceroid=VISC_LRG  ; 当两个小粘液体结合时，它们就变成这个
SmallVisceroid=VISC_SML  ; 当步兵转化为粘液体生物时

; 控制计算机人工智能如何评估潜在的离子炮目标
; 第一个值是针对强电脑对手，下一个是普通，最后是简单
; 现在，普通和困难是一样的，因为在困难模式下，电脑实际上会等待
; 如果某个对象是最佳目标，则在该对象上完成生产；通过这种方式，三者都
; 难度等级不同。

;另外，请注意这些不是加权分布。它们是绝对排序
;目标的。--gs
AIIonCannonConYardValue=10,10,10
AIIonCannonWarFactoryValue=100,100,100
AIIonCannonPowerValue=60,60,60
AIIonCannonEngineerValue=1,1,1
AIIonCannonThiefValue=1,1,1
AIIonCannonHarvesterValue=1,1,1
AIIonCannonMCVValue=1,1,1
AIIonCannonAPCValue=1,1,1
AIIonCannonBaseDefenseValue=35,35,35
AIIonCannonPlugValue=40,40,40
AIIonCannonHelipadValue=20,20,20
AIIonCannonTempleValue=40,40,40

; 离子风暴控制；gs 现在，天气控制，呃……控制
LightningDeferment=250      ; PCG；从罢工宣布到其开始之间的帧数。
LightningDamage=250         ; 雷击造成的损坏；以前是250
LightningStormDuration=180  ; 默认离子风暴持续时间（帧）。此设置会被触发控制覆盖；以前是420
LightningWarhead=IonWH      ; 离子风暴打击使用的弹头。
LightningHitDelay=10       ; 直接目标被击中的频率（以帧为单位）；以前是150
LightningScatterDelay=5    ; 随机闪电之间的帧延迟——不要减少——性能会受影响；以前是14
LightningCellSpread=10      ; 以及随机闪电能飞多远（n乘n的方格）；以前是10
LightningSeparation=3       ; SJM：云/闪电之间以单元格计算的城市街区距离
IonStorms=no                ; 随机离子风暴会出现吗？

; 棱镜炮控制；SJM
PrismType=ATESLA			; 在建筑代码中，我需要知道我什么时候有棱镜炮
PrismSupportModifier=150%	; 每个棱镜炮支撑梁增加发射光束伤害的百分比
PrismSupportMax=8			; 可能协助棱镜炮的最大支撑梁数量
PrismSupportDelay=60		; 发射支撑梁会让棱镜炮离线持续这么久
PrismSupportDuration=15		; 支撑梁可见持续时间
PrismSupportHeight=420		; 支撑梁瞄准目标建筑上方这么多粒子

; V3火箭控制；SJM
V3RocketPauseFrames=0    ; 火箭在发射器上暂停多少帧后倾斜
V3RocketTiltFrames=60    ; V3火箭倾斜到发射位置需要多少帧
V3RocketPitchInitial=0.21; 火箭倾斜前的初始俯仰角（0=水平，1=垂直）
V3RocketPitchFinal=0.5   ; 火箭倾斜后结束的俯仰角；现在开始发射
V3RocketTurnRate=0.05    ; 火箭在空中的俯仰可操纵性。通过反复试验调整。
V3RocketAcceleration=0.4 ; 每帧发射期间增加的火箭速度
V3RocketAltitude=768     ; 巡航高度（粒子）：火箭从此高度开始保持水平
V3RocketDamage=200       ; 爆炸 V3 的伤害量（爆炸中心处，估计）。
V3RocketEliteDamage=400       ; 爆炸 V3 的伤害量（爆炸中心处，估计）。
V3RocketBodyLength=256   ; 火箭的长度为这么多轻子
V3RocketLazyCurve=yes    ; 火箭的路径是一个大而缓慢的曲线。V3 可以。DMisl 不可以。
V3RocketType=V3ROCKET

; 无畏导弹控制；SJM
DMislPauseFrames=20   ; 火箭在发射器上暂停多少帧后倾斜
DMislTiltFrames=60    ; 导弹倾斜到发射位置所需的帧数
DMislPitchInitial=0   ; 导弹向上倾斜前的初始俯仰角（0=水平，1=垂直）
DMislPitchFinal=0.5   ; 导弹倾斜后最终俯仰角；现在发射
DMislTurnRate=0.08    ; 导弹在空中的俯仰机动能力。通过反复试验调整。
DMislAcceleration=0.8 ; 发射时每帧增加到导弹速度的值
DMislAltitude=768     ; 巡航高度（单位：轻子）：在此高度导弹开始水平飞行
DMislDamage=300       ; 爆炸 DMisl 的伤害量（爆炸中心处，估计）。
DMislEliteDamage=600       ; 爆炸 DMisl 的伤害量（爆炸中心处，估计）。
DMislBodyLength=128   ; 火箭的长度为这么多轻子
DMislLazyCurve=no     ; 火箭的路径是一个大而缓慢的曲线。V3 可以。DMisl 不可以。
DMislType=DMISL

; 伞兵投放控制
ParadropRadius=1024   ; 如果飞机距离投放地点在这么多轻子范围内，则投放伞兵。

; 杂项
FogOfWar=no             ; 战争迷雾是否启用？
Visceroids=no           ; 是否会出现随机出现的黏菌体？
Meteorites=no           ; 是否会出现泰伯利姆陨石？
CrewEscape=50%          ; 船员从被摧毁的载具中逃脱的百分比概率
CameraRange=9           ; 间谍摄像机周围显示地图的距离
FineDiffControl=no      ; 允许有5个难度设置，而不仅仅是3个设置吗？
Pilot=E1                ; 从飞机跳伞的飞行员类型
AlliedCrew=E1                 ; 从被摧毁的单位或建筑中出现的士兵
SovietCrew=E2                 ; 从被摧毁的单位或建筑中出现的士兵
Technician=CTECH        ; 担任技术员幸存者的平民步兵类型【应该是有武装的类型】
Engineer=ENGINEER       ; 来自建筑工厂的特殊（有限供应）步兵幸存者【可能是工程师类型】
PParatrooper=E1          ; 作为伞兵投放的步兵

;*** 增援/时间相关内容 ***

ChronoDelay=60			;时间球传送后的延迟
ChronoReinfDelay=180	;时间增援传送后的延迟
ChronoDistanceFactor=48	;default =32，用于将距离除以以获得传送延迟
ChronoTrigger=yes		;defualt=是，如果是，则延迟随距离变化，如果不是，则为常量
ChronoMinimumDelay=16	;default=0;这是传送的最小延迟，无论距离多短
						;如果ChronoTrigger标志关闭，这个值也将被使用
ChronoRangeMinimum=0	;这可以用来设置一个小范围，在该范围内延迟是恒定的
						;范围以轻子为单位测量（每个单元格256个轻子），在此范围内延迟将设置为最小值
			;ChronoDistanceFactor取值为32时，每移动一个单元格会有八帧的延迟。
			;每像素256个轻子，所以要得到每个单元格的帧延迟，请用256/ChronoDistanceFactor
			;这是一个反函数，所以数字越大意味着延迟越短
			;最小值可以为1（不能为零！），这将导致每移动一个单元格延迟256帧

;GEF
;************ 美国空降特种规则 ***********
;这两个列表必须有相同数量的元素，否则会导致严重崩溃

;AmerParaDropInf=E1,GHOST,ENGINEER ;飞机投放的步兵类型
;AmerParaDropNum=6,6,6 ;每种步兵的数量

AmerParaDropInf=E1 ;飞机投放的步兵类型
AmerParaDropNum=8 ;每种步兵的数量

AllyParaDropInf=E1 ;飞机投放的步兵类型
AllyParaDropNum=6 ;每种步兵的数量

SovParaDropInf=E2 ;飞机投放的步兵类型
SovParaDropNum=9 ;每种步兵的数量


;*** 间谍相关 ***
AlliedDisguise=E1
SovietDisguise=E2 ; 这些是间谍在未使用化妆工具包时的默认设置
SpyPowerBlackout=1000 ; 间谍关闭电源的帧时间（900 = 1分钟）
SpyMoneyStealPercent=.5 ; 你使用间谍获取的总金钱百分比
AttackCursorOnDisguise=no ;gs 如果是，鼠标在伪装单位上将显示为攻击光标，就好像它没有伪装一样。  
								;如果否，你仍然会在假闪烁的幻影上看到攻击光标，间谍始终如此

; SJM：幻影坦克的默认伪装（对象类型）
DefaultMirageDisguises=TREE01,TREE02,TREE03,TREE04	; 必须是地形类型对象（树或箱子；不能是石头）
InfantryBlinkDisguiseTime=20 ;必须大于8才可靠，可以设为0以防步兵发现幻影；这是逻辑闪烁，所以其他人也会加入开火

MaximumCheerRate=300 ;gs 以帧为单位，团队允许从键盘或ACB欢呼的间隔

;*** 新AI类型片段 ***
AISafeDistance=20 ;gs 单元距离，AI在敌方基地外进行收集时会考虑（从敌方基地中心计算）
AIMinorSuperReadyPercent=.7 ;gs 当幕帘或球体充能到此值，AI将在其AI触发器中考虑它
HarvesterTooFarDistance=5 ;gs 如果收割机距离其希望的炼油厂超过此值，它将移动到炼油厂旁边，而不是保留它，并在停止时重新计算。这应设小以近似等待时间与前往下一个炼油厂的时间的关系。
ChronoHarvTooFarDistance=50 ;gs 与上面相同，但用于时间收割机。它们不会传送得很远然后重新采集矿脉（或传送得很远然后开车返回很远），而是会待在地图的这一侧（就像两个基地一样）
AlliedBaseDefenseCounts=25,20,6 ;gs h,m,e 这是简单、普通和困难等级计划建造的基地防御的明确数量
SovietBaseDefenseCounts=25,22,6 ;gs 这些默认值是旧奥术公式用来计算的数字 ((TotalBaseCost-2000)/1500 * GDIBaseDefenseCoefficient)  3*(Level-1)
AIPickWallDefensePercent=50,25,10 ;gs h,m,e 每次电脑选择建造基地防御时，这是它用选择墙体替代选择枪类型的百分比机会（如果还有建筑需要墙体）
AIRestrictReplaceTime=400 ;gs 在电脑的建筑受到伤害后，这是限制替换丢失建筑只能是墙体、基地防御和电力的帧数
ThreatPerOccupant=10 ;gs 这是一个被占据建筑每个占用者获得的威胁值
ApproachTargetResetMultiplier=1.5 ;gs 如果目标现在距离超过武器射程乘以此值，接近目标位置应重新计算（我的接近目标选择了一个距离为1倍的点，所以如果它超过1.5，我就知道它在移动，并且我需要重新计算它的位置。）
CampaignMoneyDeltaEasy=50 ; 这些会加到所有玩家控制的房屋的普通等级积分数上（在读取房屋时，那是唯一已知的，所以不能只是玩家的房屋）
CampaignMoneyDeltaHard=-50 ; 调整这些可以改变某人在地图开始时的金钱数量。编辑器中给定的金额将用于普通模式
GuardAreaTargetingDelay=36
NormalTargetingDelay=27;gs 这些提供了以帧为单位的显式目标速率控制。警戒区域更低，因为它扫描的范围是两倍，但27,36只是TS的默认值
AINavalYardAdjacency=20 ;gs 计算机可以将他的海军工厂从他的建造工厂放置的网格距离
DisabledDisguiseDetectionPercent=15,5,2 ;gs h,m,e 该部分我太喜欢了。这是个体单位检测虚拟闪烁的幻影坦克（来自开火）的百分比几率。这是每个单位的，所以即使数字较低，当计算机附近有10个单位时几乎也是自动的
AIAutoDeployFrameDelay=15,25,100 ;//gs h,m,e AI在守卫模式下等待部署他的小队成员的帧数，以防止他们上下跳动
MaximumBuildingPlacementFailures=3 ;gs 如果电脑在尝试放置某物时卡住，但无法清理空间（因人太多而阻塞），则在失败达到此帧数后放弃。电脑每45帧（PlacementDelay）尝试一次，这可以告诉你它会尝试多久

PurifierBonus=.25 ; 百分比矿石提纯器增加矿石价值

; 空投舱飞行特性
DropPodWeapon=Vulcan2   ; 空投舱上安装的武器
DropPodHeight=2000      ; 空投舱出现时离地高度
DropPodSpeed=75         ; 空投舱下降速度
DropPodAngle=0.79       ; 空投舱下降角度 [弧度；0.40=平缓，1.18=陡峭]

; 悬浮车辆特性
HoverHeight=90         ; 悬浮车辆高度
HoverDampen=40%         ; 悬浮车辆弹跳的阻尼效果
HoverBob=.04            ; 悬浮车辆‘晃动’间隔时间
HoverBoost=150%         ; 悬浮车辆直线行驶速度
HoverAcceleration=.02   ; 加速至全速所需时间
HoverBrake=.03          ; 减速至完全停止所需时间

; 气球悬浮车辆备用特性
BalloonHoverHeight=1000         ; 悬浮车辆高度
