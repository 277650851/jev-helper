;    Unsellable = 无法出售此建筑（即使它可以建造）？
;    Wall = 这是墙类型结构吗 [适用特殊规则]（默认=否）？
;    WaterBound = 这座建筑只可以放置在水上吗（默认=否）？
;    Upgrades = 这座建筑可以应用的强化/升级数量（默认=0）
;    ShipYard = 此建筑是船厂或潜艇基地
;    SAM = 此建筑是防空导弹发射器
;    ConstructionYard = 此建筑是建筑场
;    Refinery = 此建筑是提伯利亚/矿石精炼厂
;    WeaponsFactory = 此建筑是武器工厂
;    CloakGenerator = 此建筑会使周围物体隐形吗？
;    LaserFencePost = 此建筑是激光栅栏柱，并遵守此类型建筑的规则。
;    LightIntensity = 此建筑发出的光强度（默认 = 0）。
;    LightVisibility= 该光可见的距离（以勒普顿为单位）（默认=5000）。
;    LightRedTint   = 该建筑光的红色调（默认=1.0）
;    LightGreenTint = 这栋建筑的灯光绿色色调（默认值=1.0）
;    LightBlueTint = 这栋建筑的灯光蓝色色调（默认值=1.0）
;    InvisibleInGame = 在游戏中选择时无法看到建筑，仅在编辑器中可见。（默认值=否）
;    PowersUpBuilding = 可以通过将此建筑附加到它上来升级的建筑
;    PowersUpToLevel = 此附加提供的升级量。-1=渐进式升级。正数表示特定升级。
;    Hospital = 这栋建筑可以治疗步兵吗（默认值=否）？
;    Armory = 这栋建筑是军械库吗
;    PlaceAnywhere = 这栋建筑可以忽略正常放置规则吗？仅用于非玩家放置的建筑（默认值=否）。
;    Weeder = 这是一个杂草收集设施吗（默认值=否）？
;    TogglePower = [覆盖] 可以在玩家控制下开关或受到低电力影响吗（默认值=是）？
;
;	 WST 6/23/99. 以下是单位的新深度缓冲调整
;	 ZFudgeCliff // 用于位于悬崖后方的单位穿过岩石的调整
;	 ZFudgeColumn // 调整桥梁高架支柱后的单位位置
;	 ZFudgeTunnel // 调整隧道入口后的单位位置
;	 ZFudgeBridge // 调整高大单位在桥下的位置……例如猛犸MK2
;
;这些是建筑参与城市战所需的字段
;Sight=2	;由于建筑将被“占领”，它需要能够观察
;ClickRepairable=no ;它可以被工程师修理，但一旦‘占领’就不能用扳手工具修理
;CanBeOccupied=yes ;基础城市战标志
;MaxNumberOccupants=10 ;调整人数
;DistributedFire=yes ;均等射击所有范围内单位
;Primary=AlliedOccupyW ;这两个不能是全局的，因为类型在全局之前读取。请保持顺序
;Secondary=SovietOccupyW
;Selectable=yes    ;否则你永远无法让士兵出来

;这些将控制在上次结束时间可以射击的对象。默认值为0
;这对防空/非防空武器没有影响。这些武器已能正常工作。
;海军目标定位
;	UNDERWATER_NEVER = 0，完全无法在水下射击
;	UNDERWATER_SECONDARY = 1，使用次要武器对付水下目标
;	UNDERWATER_ONLY = 2，只能在水下射击
;	ORGANIC_SECONDARY = 3，使用第二武器攻击有机体
;	SEAL_SPECIAL = 4，主要用于两栖和有机目标，次要用于海军和水下非有机目标
;	NAVAL_ALL = 5，尽管用主武器射击所有目标
; NAVAL_NONE = 6, 不要射入水中

;陆地目标定位
;	LAND_OKAY = 0,						土地没问题
;	LAND_NOT_OKAY = 1, 土地可以

