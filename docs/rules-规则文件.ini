; ******* 多人对话设置 *******
; 这些是多人对话设置。不适用于Westwood聊天，
; 仅限于游戏内对话。天哪，这真是一团糟！

; PCG；05/02/2K；向这个添加了一堆东西，试图获取所有内容
; 可以从一个地方控制。
;
; MinMoney = 滑块中可选择的最小金额。(默认值=2500)
; Money = 显示在滑块上的默认金额。（默认值=10000）
; MaxMoney = 滑块中可选择的最大金额。（默认值=10000）
; MoneyIncrement = 当滑块位置变化时金钱的变化量
;                  更改其最小金额。（默认值=100）
; MinUnitCount = 游戏中起始单位的最小数量。(默认=1)
; UnitCount = 默认初始单位数。(默认=10)
; MaxUnitCount = 起始单位的最大数量。（默认值=20）
; TechLevel = 游戏中可达到的最高技术水平。(默认=10)
; GameSpeed = 游戏初始速度。出于某种古怪的原因，0=最快，6=最慢。（默认=0）
; AIDifficulty = 起始 AI 难度。 (默认=1)  (0=简单, 1=普通, 2=困难)
; AIPlayers = AI玩家的起始数量。小冲突中始终至少为1。 (默认=0)
; BridgeDestruction = 桥梁可以被摧毁吗？(默认=true)
; ShadowGrow = 遮蔽物会重新生长吗？（默认=否）不支持。
; Shroud = 地图上有裹尸布吗？（默认=是）尚不支持。
; Bases = 你能建造建筑物，还是这只是单位与单位的混战？（默认=是） 不支持。
; TiberiumGrows = 矿石/泰伯利姆/无论什么会再生吗？（默认=是）
; Crates = 游戏中会出现箱子吗？（默认=是）
; CaptureTheFlag = 这是一个CTF游戏吗？（默认=否）不支持。
; HarvesterTruce = 收割机是否免受敌方火力？（默认=否）已不支持。
; MultiEngineer = 你是否需要多个工程师来接管一栋建筑？（默认=否）不支持DES。
; AlliesAllowed = 这个游戏允许盟友吗？（默认=否）
; ShortGame = 当玩家的最后一栋建筑被摧毁时，他会被淘汰吗？（默认=是）
; FogOfWar = 这款游戏中有战争迷雾吗？（默认=否）
; MCVRedploys = 玩家可以重新部署MCV吗？（默认=是）

