; Groundspeed = 所有地面单位速度的乘数 [数值越大表示越快]（默认=1.0）
; ROF = 所有武器射速的倍数 [数值越大射速越慢] (默认=1.0)
; BuildTime = 一般物体建造时间的乘数 [数值越大建造时间越长] (默认=1.0)
