; ******* 体素碎片类型 *******
; Translucent = 是用半透明方式绘制的碎片（默认=no）？
; Elasticity = 物体的“弹性” [应为0.0到1.0] (默认=0.75)
; MinAngularVelocity = 碎片旋转的最小速率，单位为度（默认=0.0）
; MaxAngularVelocity = 碎片旋转的最大速率，单位为度（默认=10.0）
; Duration = 碎片存在的最大帧数（默认=30）
; MinZVel = 初始Z方向最小速度（默认=3.5）
; MaxZVel = 初始Z方向最大速度（默认=5.0）
; MaxXYVel = 初始横向速度最大值（默认=15.0）
; ShareBodyData = 从其他类型的物体体素数据中获取体素数据（默认=no）？
; ShareTurretData = 从另一类型的炮塔体素数据获取体素数据（默认 = 否）？
; ShareBarrelData = 从另一类型的炮管体素数据获取VOXEL数据（默认 = 否）？
; ShareSource = 要从中共享体素数据的对象名称（默认 = 无）
; VoxelIndex = 体素数据中要使用的体素部件（默认 = 0）
; StartSound = 当体素动画创建时播放的声音（默认 = VOC_NONE）
; BounceSound = 当体素动画反弹时播放的声音（默认 = VOC_NONE）
; ExpireSound = 当体素动画到期时播放的声音（默认 = VOC_NONE）
; BounceAnim = 体素动画反弹时触发的动画（默认 = ANIM_NONE）
; ExpireAnim = 体素动画到期时触发的动画（默认 = ANIM_NONE）
; TrailerAnim = 跟随对象的尾随动画（通常是烟雾或火焰）
; DamageRadius = 如果物体距离小于此距离，碎片将对其造成伤害
; Damage = 对被击中物体造成的伤害量
; Warhead = 用于造成伤害的弹头
; AttachedSystem = 附加到体素动画的粒子系统
; Spawns = 当此体素碎片爆炸时生成的粒子（默认 = 无）
; SpawnCount = 生成的粒子数量 [平均] (默认 = 0)

