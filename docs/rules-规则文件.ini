// PCG; 提供旋钮以调整被荒废者及其朋友使用的辐射。
[Radiation]
RadDurationMultiple=1		; 每个辐射水平下站点持续的帧数。
							; 当辐射等级降为零时，辐射地点会自我删除。
							; --> 站点持续时间为（等级 x 辐射持续时间倍数）帧。
							; 供参考，核弹会释放2000单位的辐射。
							; 3 帧的倍数意味着射频站点活动时间为 6000
							; 帧数——大约 3 分多钟，30 赫兹。
RadApplicationDelay=16		; 对单位施加辐射的时间间隔。
RadLevelMax=500				; 一个电池允许的最大辐射量。电池实际可以有更多辐射
							; 但它只会造成仿佛达到了最大等级的伤害。
RadLevelDelay=90			; 辐射水平递减之间的帧延迟。
							; 等级更新得这么频繁，但速度仍然如规定所示
							; 在 RadDurationMultiple 中。
RadLightDelay=90			; 辐射照明强度下降之间的帧延迟。
							; 这不应低于 RadLevelDelay，因为它会
							; 不会产生任何视觉上的好处，只是浪费处理器周期。
RadLevelFactor=0.2				; 按给定辐射水平调整造成的伤害。
RadLightFactor=0.1			; 缩放因子亮度在辐射显示中的作用。
RadTintFactor=1.0			; 缩放因子色调在辐射显示中的作用。
RadColor=0,255,0			; 辐射的颜色。
RadSiteWarhead=RadSite		; 设置被辐射瓦片使用的弹头。


// PCG; 启用自定义高度对射击影响的效果。
[ElevationModel]
ElevationIncrement=4			; 源和目标之间级别的数量，以触发范围加成。
ElevationIncrementBonus=2		; 在源点和目标点之间每次高度增量（非地图等级）增加的射程加成数量。
								; 换句话说，如果 ElevationIncrement 参数是 4，这个值将应用于每一个
								; 四个级别之间以及源目标。在这四个映射级别之间不是每次都进行一次
								; 源和目标。
ElevationBonusCap=2				; 对范围奖励的上限，以防在罕见情况下扫描成本增加。

// PCG; 启用自定义墙面对射击的影响。
[WallModel]
AlliedWallTransparency=no		; 如果是这样，盟军的城墙不会影响盟军单位的射击。
WallPenetratorThreshold=50%		; 单位在尝试穿墙攻击目标之前必须造成的伤害量。


