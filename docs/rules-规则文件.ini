; ******* 任务控制 *******
; 这指定了各种一般行为特征
; 对象可以被分配的任务。每个游戏对象必须
; 处于一个任务中。任务行为通常被硬编码到
; 这个程序，但有一些行为特征可以
; 会被覆盖。不要修改这些。

; NoThreat = 它的武器是否被禁用，因此在被攻击之前被忽略为潜在目标（默认值=no）？
; Zombie = 被迫像僵尸一样坐在那里并且永远无法恢复（def=no）？
; Recruitable = 它能被招募加入队伍或基地防御吗（def=是）？
; Paralyzed = 物体是否被冻结在原地但仍能射击和运作（默认为否）？
; Retaliate = 在这个任务中允许进行报复（默认=yes）？
; Scatter = 是否允许从威胁中散开（默认=是）？
; Rate = 正常处理之间的延迟（数值越大 = 游戏越快，响应性越差）
; AARate = 防空延迟率（如果未指定，则使用常规速率）。

; 单位静止不动并装死。
[Sleep]
Recruitable=no
