; ******* 计算机活动的 IQ 设置 *******
; 每个玩家（无论是电脑控制还是其他）都会被赋予一个智商评分，该评分会被使用
; 控制计算机被允许自动控制的内容。这是
; 与难度设置不同。智商设置越高，越自主
; 以及该方的智能表现。每种能力都有一个评级
; 表示将赋予该能力的智商水平（或更高）。因为这样的
; 能力由计算机自动执行，使人类可以控制
; 国家不推荐高智商。否则玩家的单位将开始
; 自动“自作主张”！一个由人类控制的国家被认为拥有
; 零智商评分。一个由电脑控制的国家智商为1或更高。
; 当处于小规模冲突模式或多人游戏 AI 激活时，电脑智商设置为
; 最大值
