; 难度设置*******
; 游戏难度由这些因素控制。其中一些因素会
; 只影响电脑玩家。电脑和玩家的限制是
; 个人设置。因此，计算机可能在“困难”难度下进行游戏，而
; 玩家可能在“简单”难度下棋。

; Airspeed =所有空军单位的速度乘数（def=1.0）
; Armor = 所有单位和建筑的装甲强度乘数（def=1.0）
; Cost = 所有单位和建筑的成本乘数（默认值=1.0）
; Firepower = 所有武器的火力乘数（默认值=1.0）
; Groundspeed = 所有地面单位的速度乘数（默认值=1.0）
; ROF = 所有武器射速的倍数 [数值越大射速越慢] (默认=1.0)
; BuildSlowdown = 电脑应该比玩家建造慢吗（默认值=否）？
;  <<< 影响电脑玩家，不影响真人玩家 >>>
;    ContentScan = 在选择最佳目标时是否考虑运输工具的内容（默认值=否）？
;    RepairDelay = 发起建筑维修之间的平均延迟（分钟）
;    BuildDelay = 发起建造之间的平均延迟（分钟）
;    DestroyWalls = 是否允许扫描附近敌方墙壁并摧毁它们（默认值=是）？

