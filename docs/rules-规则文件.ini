; ******* 随机箱子强化道具 *******
; 这指定了指定箱子增强道具出现的几率
; 在一个“随机”箱子里。机会以“份额”的形式表示
; 在指定的总股份中。
;
; 第二个参数是拾起这个箱子时使用的动画。
;
; 第三个参数指定该货箱是否可以在水上运输。
;
; 如果存在，第四个参数指定
; 那个箱子强化所需的数据值。它们的意思不同
; 用于不同的增强道具。
[Powerups]
Armor=10,ARMOR,yes,1.5              ; 附近物体的护甲增加（护甲倍数）；想象最大力量被这个乘以（实际上，伤害被这个除，因为在 Type 中你无法改变最大值）
Firepower=10,FIREPOWR,yes,2.0       ; 附近物体的火力增加（火力倍增）
HealBase=10,HEALALL,yes              ; 所有建筑物达到满强度
Money=20,MONEY,yes,2000             ; 一大笔现金（最大现金）
Reveal=10,REVEAL,yes                 ; 显示整个雷达地图
Speed=10,SPEED,yes,1.2              ; 附近物体的速度增加（速度倍增器）
Veteran=20,VETERAN,yes,1             ; 老兵升级（升级的等级）
Unit=20,<none>,no                  ; 车辆

Invulnerability=0,ARMOR,yes,1.0     ; 无敌（持续时间，以分钟计）
IonStorm=0,<none>,yes               ; 发起离子风暴
Gas=0,<none>,yes,100                ; 提比利乌姆气体（每个气体云造成伤害）
Tiberium=0,<none>,no               ; 钛矿补丁
Pod=0,<none>,no                    ; 空投舱特殊
Cloak=0,CLOAK,yes                   ; 在附近物体上启用隐形
Darkness=0,SHROUDX,yes              ; 隐藏整个雷达地图
Explosion=0,<none>,yes,500          ; 高爆坏蛋（每次爆炸伤害）
ICBM=0,CHEMISLE,yes                 ; 核导弹一次射击
Napalm=0,<none>,no,600             ; 火焰爆炸坏蛋（伤害）
Squad=0,<none>,no                 ; 随机步兵小队


