; ******* 单位统计 *******
; 指定各种游戏对象的特性。

; AllowedToStartInMultiplayer = 单位是否可以在开始多人游戏时分配给玩家（默认值=是）
; Ammo = 每次重新装填之间携带的发射次数 [-1 表示无限]（默认值=-1）
; Armor = 这个物体的护甲类型 [无, 木, 轻型, 重型, 混凝土] (默认=无); 在 RA2 中添加了更多类型
; BuildLimit = 每栋房屋允许建造的任意最大值（默认=-1 —— 无限制）
; Cloakable = 它是否配备了隐形装置（默认=否）？
; Cost = 建造物体的成本（以信用点计）
; Category = 对象的类别 [由人工智能系统使用 -- “士兵”、“平民”、“贵宾”、“船只”]
;            "侦察", "装甲侦察车辆", "步兵战车", "轻型远程火力支援", "支援", "运输", "空中力量", "空运"
; CloakStop = 单位停止移动时是否隐身（默认值=否）？
; Crewed = 是否有可以逃生的船员 [绝不包括步兵]（默认=no）？
; Gunner = 是否根据已添加的炮手改变能力。（默认=否）
; CrushSound = 如果此对象类型被压碎时播放的声音（默认=无）
; DeployFire = 该单位部署后可以开火。（默认=no）
; DeployFireWeapon = 部署时要开火的武器索引。0 或 1。（默认=1）
; DeployTime = 部署或撤销部署该对象所需的时间，以分钟为单位 [如果该对象可以执行此操作]
; DamageReducesReadiness = 如果对单位的伤害会减少其弹药（因为弹药爆炸或失效，或其他原因）则为是（默认值=否）
; Disableable = 该对象是否可以通过特殊多人选项被禁用（默认值=是）？
; DistributedFire = 单位是否持续重新锁定附近单位并对所有单位开火（默认值=否）
; DoubleOwned = 是否可以在多人游戏中被所有国家建造/拥有（默认值=否）？
; EmptyReload = 单位空弹时第一次装填前的帧数。-1表示使用标准装填时间（默认值=-1）
; Explodes = 被摧毁时是否会剧烈爆炸[即是否造成附带伤害]（默认值=否）？
; Explosion = 爆炸时使用的爆炸效果[不适用于步兵]（默认值=无）
; FireAngle = 投射物发射和炮管倾角[0 = 水平, 64 = 垂直]（默认值=50）
; Gate = 该建筑是否为大门？（默认值=否）
; GateCloseDelay = 大门开启后关闭前的延迟时间，以分钟为单位。
; GuardRange = 扫描敌人以进行攻击的距离（默认=使用武器射程）
; Image = 用于此对象的图形数据名称（默认=与对象标识相同）
; Immune = 该对象是否免疫伤害
; ImmuneToPsionics = 单位是否免疫心灵能力（默认=否）？
; ImmuneToRadiation = 单位是否免疫辐射（默认=否）？
; ImmuneToVeins = 是否免疫血脉生物攻击（默认=否）？
; InitialAmmo = 单位起始弹药数量。-1表示满弹开始。（默认=-1）
; Invisible = 对敌人是否完全且始终不可见（默认=否）？
; Insignificant = 当此对象被摧毁时是否不被公告（默认=否）？
; LegalTarget = 是否允许被作为战斗目标（默认=是）？
; Name = 指定对象的显示名称
; Nominal = 总是使用指定名称而非通用“敌方对象”（默认=否）？
; OmniFire = 射击时是否无需旋转。（默认=否）
; OpportunityFire = 在执行其他动作（如移动）时是否可以开火（默认=否）。
; Owner = 谁可以建造这个单位 [GDI 或 Nod] (默认=无)
; PipScale = 显示点数的依据 [乘客, 提比里姆, 弹药, 能量] (默认=无)
; PipWrap = 绘制多少点数后换行 (默认=无)
; Points = 得分用途的点数值 (默认=0)
; Prerequisite = 制造此单位之前所需的建筑列表 (默认=无要求)
; PreventAttackMove = 这个单位是否知道如何进行攻击移动？(默认=<是, 如果它有武器>)
;   可用于覆盖不应攻击移动的单位的攻击移动设置。
; PreventAutoDeploy = 这个单位是否知道如何进行自动部署？(默认=<是, 如果单位支持部署>)
;	可用于覆盖可部署单位的自动部署设置。
; Primary = 装备的主要武器 (默认=无)
; Secondary = 装备的次要武器 (默认=无)
; ElitePrimary = 精英老兵状态下的新主要武器 (默认=与主要武器相同)
; EliteSecondary = 精英老兵状态下的新次要武器 (默认=与次要武器相同)
; RadarVisible = 即使在伪装下也能在雷达上看到吗？（默认=是 [步兵=否]）
; ROT = 机体（如有）和炮塔（如有）的转向速度（默认为0）
; ReadinessReductionMultiplier = 用于调整伤害降低准备度的程度。0 表示取消准备度降低。（默认值=0）
; Reload = 两次装填之间的时间延迟（默认=0）
; ReloadIncrement = 每次 ((MaxAmmo / PipWrap) %0) 增量要增加的数量。用于逐渐减慢重装速度。（默认值=0）
; RadarInvisible = 在雷达地图上是否不可见（默认=否）？
; RadialFireSegments = 如果此单位具有径向射击模式，这将决定数量
;    段的。 从单位的左侧开始，向右延伸180度。（默认值=0）
; SelfHealing = 这个对象是否会自动恢复到半强度（默认=否）？
; Selectable = 这个对象可以被玩家选择吗（默认=是）？
; Sensors = 是否有传感器来检测附近的隐形物体（默认=否）？
; Sight = 视野范围，以格子为单位（默认=1）
; Size = 单位在货舱中占用的空间量（默认=1）
; SizeLimit = 运输工具可以携带的最大单位尺寸（默认=0）（大小包含在内。限制3意味着可以容纳3个单位）
; Storage = 此建筑或单位可以存储的“包裹”数量（默认=0）
; Strength = 该对象的耐久值（生命值）
; TargetLaser = 是否具有目标激光（默认=否）？
; Trainable = 该对象能否通过经验成为老兵（默认=是，建筑默认=否）？
; Turret = 是否配备类似上层建筑的炮塔[绝不适用于步兵]（默认=否）？
; TurretSpins = 炮塔是否仅旋转[仅当装备炮塔时]（默认=否）？
; TechLevel = 建造此对象所需的科技等级[-1表示无法建造]（默认=-1）
; ToProtect = 当友军单位受到攻击时是否前去救援[仅电脑]（默认=否）？
; TypeImmune = 如果由同一方拥有，是否免疫来自同类型对象的伤害？
; UndeployDelay = 单位自动撤卸所需时间。（默认=-1）
; VoiceSelect = 选择此对象时的声音列表（默认=无）
; VoiceMove = 在给对象下达移动指令时使用的语音列表（默认=无）
; VoiceAttack = 在给对象下达攻击命令时使用的语音列表（默认=无）
; DieSound = 死亡时使用的声音列表（默认=无）
; VoiceFeedback = 可能在受到伤害时发出的声音列表（默认值=无）
; Locomotor = 处理此对象移动的对象的 CLSID（默认=雕像）
; VeteranAbilities = 要赋予的资深技能列表（默认=无）
; EliteAbilities = 要授予的精英能力列表，可与老兵能力累积（默认值=无）
