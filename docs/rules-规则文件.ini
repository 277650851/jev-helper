; ******* 武器统计 *******
; 这里指定的武器附加在各种战斗
; 单位和建筑上。

; Anim = 发射效果显示的动画 [方向变化使用 8]
; AreaFire = 指示武器是否对当前格子开火并在半径范围内造成伤害（默认=否）。警告：目前这只适用于辅助武器。
; Bright = 当弹药命中时，这种武器是否产生光效（默认=否）？如果设置了，将覆盖弹头的 'Bright' 标志。
; Burst = 这件武器的快速连续射击次数（默认=1）
; Camera = 显示射击者周围的区域（默认=否）？
; Charges = SJM：我已禁用此系统。请改用 ART.INI 中的 IsAnimDelayedFire。它是否具有开火前充能逻辑（默认=否）？
; Damage = 每颗子弹造成的伤害量（未衰减）
; Floater = 像飞盘一样漂浮
; IonSensitive = 离子风暴期间会关闭（默认=否）？
; Lobber = 投射物是否以高弧线飞向目标（默认=否）？
; MinimumRange = 对目标的最小射程（默认=0）
; Projectile = 使用的投射物特性
; RadLevel = 武器造成的辐射水平（默认=0）
; Range = 最大格子射程
; ROF = 射击间延迟 [15 = 中速设定下 1 秒]
; Report = 射击时随机播放的音效列表
; Speed = 投射物到目标的速度（100 为最大）
; Supress = 是否扫描附近友方建筑，如果发现则阻止对目标开火（默认=否）？
; TurboBoost = 当武器对飞机开火时，是否应该获得加速奖励？
; UseFireParticles = 武器是否应该生成火焰粒子系统？（默认 = 否）
; Warhead = 附加到弹丸的弹头

