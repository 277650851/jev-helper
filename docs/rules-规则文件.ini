; ******* 弹头特性 *******
; 这就是赋予游戏“石头、剪刀、布”特性的原因。
; 它描述了如何将伤害施加到目标上。
; 数值应该考虑“影响范围”。
; 例如：尽管穿甲坦克炮弹会立即
; 如果击中，一个士兵被击杀，反步兵评分仍然是
; 非常低，因为坦克炮弹的作用范围非常有限
; 效果，缺乏精准性，并承认这一事实
; 坦克对采取掩护的步兵威胁很小。

; Spread = 已过时。保留条目以为新的 spread 系统提供基准
; Wall = 这个弹头会破坏混凝土墙吗（默认=否）？
; WallAbsoluteDestroyer = 这个弹头是对墙体造成致命伤害，而不是造成一次伤口吗？（默认=否）；gs
; Wood = 这个弹头会破坏木墙吗（默认=否）？
; Fire = 这会产生高温，从而融化冰吗（默认=否）？
; Radiation = 这是辐射武器吗？某些单位将对此免疫。（默认=否）
; Tiberium = 这个弹头会摧毁泰伯利姆吗（默认=否）？
; Sparky = 这个弹头会产生残余火焰吗（def=否）？
; Conventional = 爆炸战斗部够大到撞击水面时会溅起水花吗 [核弹太大，不适用]（默认=否）？
; Rocker = 这个弹头是否会在命中时让附近单位摇晃（默认=no）？
; AnimList = 弹头爆炸时播放的动画列表 [按伤害从小到大排序]
; Verses = 对各种装甲类型的伤害值（占总伤害的百分比）...
;           -vs- 无, 高爆弹, 钢板 //步兵
;				轻型, 中型, 重型 //单位
;				木, 钢, 混凝土 //建筑
;				Special_1, Special_2 //还不知道
; 3-17 Special_1 是冲锋兵的电能护甲。
; 5-11 Special_1 现在是恐怖无人机的“我是一种具有步兵弱点的单位”护甲
; 5-11 Special_2 现在是生成火箭的护甲，用于防止它们在被射击时互相炸毁
; 注意：0%意味着完全禁止发射。你不能下达发射命令，它也不会自行发射
; 1%意味着它不会自动发射，但会接受强制发射命令
; InfDeath = 使用哪种步兵死亡动画（默认=0）
;             0=瞬死, 1=旋转死亡, 2=爆炸, 3=飞行死亡, 4=烧死, 5=电死
; 新条目 6=尤里 头部爆炸 7=核熔毁
; Deform = 这个弹头击中地面时造成损害的几率（默认=0）
; DeformThreshhold = 损伤必须超过此数值才能发生变形（默认=0）
; Particle = 爆炸发生时使用的粒子效果（默认=无）
; ProneDamage = 平卧时步兵受到的伤害修正（默认=1.0）
; Bright = 这个弹头在爆炸时通常会产生光效吗（默认=否）。在子弹的情况下，会被武器的 'Bright' 标志覆盖。
; CombatLightSize = 最大大小的百分比；>0% 表示强制战斗光大小，覆盖基于伤害的数值（默认=0%）
; Bullets = 这个武器是一堆类似子弹的枪械射击吗？（默认=否）
; CellSpread（默认0）= 替代 Spread 和 WideDamage。这实际上是这个弹头的伤害传播范围
;   0 只会明确伤害目标，任何更高数值至少会搜索周围一些格子并比较距离
; CellInset (默认 0)=使用此设置告诉自动部署在自动部署之前我们需要在 CellSpread 内部达到多少。
;   这样的话，破坏者不会在目标刚好位于边缘时立即开火——他会向内移动一点。
; PercentAtMax (默认 1.0)=这是其在最大射程时造成的伤害百分比；用于线性控制衰减

