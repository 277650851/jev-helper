; ******* 弹丸统计 *******
; 抛射物描述了在武器飞行时如何以及使用什么图像
; 到其目标。将弹丸视为所使用的“传递方式”
; 将弹头送到预定目标。

; AA = 这件武器能攻击飞行中的飞机吗（默认=否）？
; AG = 这件武器可以攻击地面目标吗（默认=是）？
; AN = 这件武器能否对海上目标开火（def=yes）？
; AS = 这件武器能够对潜水物体开火吗（默认=否）？
; ASW = 这是反潜战武器弹药吗（默认=否）？
; Acceleration = 导弹速度增加量（默认=3）
; Airburst = 它是否尝试飞越目标而不是直接击中它（默认=否）？
; Arcing = 子弹是否使用弧线路径而不是直线路径？（默认=否）
; Arm = 武装延迟（默认=0）
; Bouncy = 撞击时会有一点反弹吗（默认=否）？
; Cluster = 附着在弹丸上的爆炸数量 [集束炸弹] (默认=1)
; Color = 用于特殊重新映射投射物的颜色（默认 = 无）
; CourseLockDuration = 投射物保持其初始航向锁定的帧数。(默认=0)
; Degenerates = 子弹在飞行过程中强度会减弱吗？(默认=否)
; Dropping = 它是否从起始高度下落？(默认=否)
; Level = 它在飞行中保持同一高度吗？(目前也作用为 IsTorpedo)
; Elasticity = 物体的“弹性” [应为0.0到1.0] (默认=0.75)
; Image = 飞行中使用的图像
; Inaccurate = 它本身不准确吗？(默认=否)
; Inviso = 投射物在飞行中是隐形的吗？(默认=否)
; Parachuted = 装有从飞机投放的降落伞吗？(默认=否)
; Proximity = 靠近目标时会爆炸吗？(默认=否)
; ROT = 转向速度 [非零表示有追踪能力] (默认=0)
; Ranged = 它会耗尽燃料吗？(默认=否)
; Scalable = 它的动画可以实时放大或缩小吗？(默认=否)
; Shadow = 如果高，这颗子弹需要绘制影子吗？(默认=是)
; SubjectToCliffs = 这个子弹会被向上的悬崖阻挡吗？ 对追踪导弹无效。(默认=否)
; SubjectToElevation = 这个子弹会因为高度获得射程加成吗？ 对追踪导弹无效。(默认=否)
; SubjectToWalls = 这个子弹会被墙体阻挡吗？ (默认=否)
; VeryHigh = 它会以很高的巡航高度飞行吗？(默认=否)



